name: Release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install validation dependencies
        run: pip install -e ".[dev,docs,langchain,llamaindex,qdrant,pgvector]"
      - name: Prepare private NLTK assets
        # Keep optional LlamaIndex data out of shared writable package caches.
        run: |
          export NLTK_DATA="$RUNNER_TEMP/omnichunk-nltk-data"
          printf 'NLTK_DATA=%s\n' "$NLTK_DATA" >> "$GITHUB_ENV"
          umask 077
          install -d -m 700 "$NLTK_DATA"
          python - <<'PY'
          import os
          import nltk
          for asset in ("punkt", "punkt_tab", "stopwords"):
              nltk.download(asset, download_dir=os.environ["NLTK_DATA"], quiet=True, raise_on_error=True)
          for resource in ("tokenizers/punkt", "tokenizers/punkt_tab", "corpora/stopwords"):
              nltk.data.find(resource)
          PY
      - name: Verify source, behavior and documentation
        run: |
          ruff check src tests
          ruff format --check src tests
          mypy --strict --python-version ${{ matrix.python-version }} src/omnichunk
          pytest -n auto -q --cov=omnichunk --cov-branch --cov-report=term-missing --cov-fail-under=90
          python scripts/check_benchmarks.py --run-quality
          mkdocs build --strict

  wheel-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and validate a dependency-free installed wheel
        run: |
          python -m pip install build twine
          python -m build
          python scripts/check_release.py

  artifacts:
    needs: [validate, wheel-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build and benchmark dependencies
        run: pip install -e ".[dev]" build twine
      - name: Establish previous release baseline
        shell: bash
        run: |
          set -euo pipefail
          baseline_ref=$(git describe --tags --abbrev=0 "${GITHUB_SHA}^")
          printf 'BASELINE_REF=%s\n' "$baseline_ref" >> "$GITHUB_ENV"
      - name: Require equivalent same-runner performance evidence
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: >-
          python scripts/check_benchmarks.py --compare-ref "$BASELINE_REF" --require-baseline
          --comparison-report reports/release-benchmark.json
          --transition-manifest benchmarks/transition_baseline.json --release-tag "$RELEASE_TAG"
      - name: Preserve benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-benchmark
          path: reports/release-benchmark.json
          if-no-files-found: warn
      - name: Build distributions
        run: python -m build
      - name: Verify tag, wheel, sdist and isolated runtime
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: python scripts/check_release.py --tag "$RELEASE_TAG"
      - name: Upload validated distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  github-release:
    if: github.event_name == 'push'
    needs: artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
      discussions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Publish GitHub release and announcement
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/publish_github_release.py

  publish:
    needs: artifacts
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/omnichunk/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Publish validated artifacts to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
