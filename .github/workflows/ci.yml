name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docs,langchain,llamaindex]"

      - name: Verify AI rule sync
        run: python scripts/check_ai_rules_sync.py

      - name: Run benchmark regression gate
        run: python scripts/check_benchmarks.py --run-quality

      - name: Historical throughput check (explicitly skips absent baseline)
        run: python scripts/check_benchmarks.py --run-regression-gate

      - name: Run tests
        run: pytest -n auto -q --cov=omnichunk --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Upload branch coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          flags: branch-coverage

      - name: Run Ruff
        run: ruff check src tests

      - name: Check formatting
        run: ruff format --check src tests

      - name: Run mypy (strict, full package)
        # NumPy selects type syntax based on mypy's target version. Use the
        # interpreter represented by this matrix job rather than the package's
        # minimum supported Python version for every job.
        run: mypy --strict --python-version ${{ matrix.python-version }} src/omnichunk

      - name: Build documentation (MkDocs)
        run: mkdocs build --strict

  wheel-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and validate a dependency-free installed wheel
        run: |
          python -m pip install build twine
          python -m build
          python scripts/check_release.py
