name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NLTK_DATA: ${{ runner.temp }}/omnichunk-nltk-data
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docs,langchain,llamaindex,qdrant,pgvector]"

      - name: Run benchmark regression gate
        run: python scripts/check_benchmarks.py --run-quality

      - name: Install tested retrieval comparators
        if: matrix.python-version == '3.12'
        run: pip install -r benchmarks/retrieval/requirements.txt

      - name: Prepare private NLTK assets
        # Recent NLTK refuses shared writable package caches. Download serially
        # before workers start; older LlamaIndex also expects the punkt package.
        run: |
          umask 077
          install -d -m 700 "$NLTK_DATA"
          python - <<'PY'
          import os
          import nltk
          for asset in ("punkt", "punkt_tab", "stopwords"):
              nltk.download(asset, download_dir=os.environ["NLTK_DATA"], quiet=True, raise_on_error=True)
          for resource in ("tokenizers/punkt", "tokenizers/punkt_tab", "corpora/stopwords"):
              nltk.data.find(resource)
          PY

      - name: Historical throughput check (explicitly skips absent baseline)
        run: python scripts/check_benchmarks.py --run-regression-gate

      - name: Run tests
        run: pytest -n auto -q --cov=omnichunk --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Upload branch coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          flags: branch-coverage

      - name: Run Ruff
        run: ruff check src tests benchmarks/run_retrieval.py benchmarks/import_squad.py benchmarks/prepare_dense.py benchmarks/compare_retrieval.py benchmarks/run_dense_experiment.py benchmarks/retrieval

      - name: Check formatting
        run: ruff format --check src tests benchmarks/run_retrieval.py benchmarks/import_squad.py benchmarks/prepare_dense.py benchmarks/compare_retrieval.py benchmarks/run_dense_experiment.py benchmarks/retrieval

      - name: Run mypy (strict, full package)
        # NumPy selects type syntax based on mypy's target version. Use the
        # interpreter represented by this matrix job rather than the package's
        # minimum supported Python version for every job.
        run: mypy --strict --python-version ${{ matrix.python-version }} src/omnichunk

      - name: Build documentation (MkDocs)
        run: mkdocs build --strict

      - name: Validate retrieval evaluation on the development corpus
        if: matrix.python-version == '3.12'
        run: >-
          python benchmarks/run_retrieval.py --split dev
          --tools omnichunk,fixed,semchunk,langchain,semantic-text-splitter,chonkie,llamaindex
          --chunk-sizes 128 256 --repeats 3 --require-all
          --output reports/retrieval-ci.json

      - name: Validate external development corpus
        if: matrix.python-version == '3.12'
        run: >-
          python benchmarks/run_retrieval.py --corpus benchmarks/retrieval/corpus_squad_v1
          --split dev
          --tools omnichunk,fixed,semchunk,langchain,semantic-text-splitter,chonkie,llamaindex
          --chunk-sizes 128 256 --repeats 3 --require-all
          --output reports/retrieval-squad-ci.json

      - name: Preserve retrieval evaluation evidence
        if: matrix.python-version == '3.12' && always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-evaluation
          path: reports/retrieval-*.json
          if-no-files-found: warn

  wheel-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and validate a dependency-free installed wheel
        run: |
          python -m pip install build twine
          python -m build
          python scripts/check_release.py
