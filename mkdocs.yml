site_name: Omnichunk
site_description: Structure-aware deterministic chunking for code, prose, and markup.
site_url: https://oguzhankir.github.io/omnichunk/
repo_url: https://github.com/oguzhankir/omnichunk
repo_name: oguzhankir/omnichunk
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            members_order: source

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Start here: index.md
  - User guide:
      - Installation: install.md
      - Chunking recipes: usage.md
      - Index, retrieve and synchronize: indexing.md
      - Source and budget contracts: reference/contracts.md
      - API stability: api-stability.md
      - Migrating an existing index: migrations/v2.md
  - Roadmap: https://github.com/oguzhankir/omnichunk/blob/main/ROADMAP.md
  - Performance: performance/sla.md
  - Contributing:
      - Mutation testing: contributing/mutation-testing.md
  - Reference:
      - Chunking API: reference/chunker.md
      - Chunk options: reference/options.md
      - Data models: reference/data-models.md
      - Indexing and integrations: reference/indexing-api.md
      - Advanced APIs: reference/advanced.md
